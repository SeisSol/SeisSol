# Severe velocity weakening with the parameters of fault-rs.yaml. At the
# initial slip rate the law holds a friction between f0 - b and f0 (0.588 and
# 0.6) in a non-negative state, and the prestress lies inside that range; the
# 0.625 of the other laws would need a negative one. The nucleation stress
# exceeds f0 + a, so slip turns dynamic within the run.
!ConstantMap
map:
  s_xx:   -120.0e6
  s_yy:   0.0
  s_zz:   0.0
  s_xy:   70.8e6
  s_yz:   0.0
  s_xz:   0.0
  nuc_xx: 0.0
  nuc_yy: 0.0
  nuc_zz: 0.0
  nuc_xy: 40.0e6
  nuc_yz: 0.0
  nuc_xz: 0.0
  rs_a:     0.008
  rs_sl0:   0.02
