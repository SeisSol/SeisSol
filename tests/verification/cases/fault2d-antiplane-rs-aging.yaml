# The spontaneous antiplane rupture of fault2d-antiplane.yaml with the aging
# law, under f_0 = 0.6, V_0 = 1e-6 m/s and b = 0.012 of the parameter file,
# from a creep of 1e-16 m/s, whose state holds the shear traction of 75 MPa
# along z. A slip rate V raises the friction by a ln(V / 1e-16 m/s) before
# the state evolves, by 18 MPa at 5 m/s, and the state then weakens it at
# b sigma / L = 290 MPa/m, towards the steady state of 57 MPa at 5 m/s. The
# rise and the rate of the weakening are those of fault2d-antiplane.yaml,
# 18 MPa and 230 MPa/m, within a factor of 1.3, so that the cohesive zone is
# about as wide. The nucleation adds 25 MPa over |y| <= 120 m, which falls
# off linearly to nothing at |y| = 220 m, and ramps over t_0: the fault
# slips over |y| < 120 m from 8 ms on, and the rupture runs on to both sides
# on its own, at up to 2.9 km/s, as antiplane.py computes it.
!Switch
[s_xx, s_yy, s_zz, s_xy, s_yz, s_xz, nuc_xx, nuc_yy, nuc_zz, nuc_xy, nuc_yz, rs_a, rs_sl0]: !ConstantMap
  map:
    s_xx:   -120.0e6
    s_yy:   0.0
    s_zz:   0.0
    s_xy:   0.0
    s_yz:   0.0
    s_xz:   75.0e6
    nuc_xx: 0.0
    nuc_yy: 0.0
    nuc_zz: 0.0
    nuc_xy: 0.0
    nuc_yz: 0.0
    rs_a:   0.004
    rs_sl0: 0.005
[nuc_xz]: !Any
  components:
    - !AxisAlignedCuboidalDomainFilter
      limits:
        x: [-.inf, .inf]
        y: [-120.0, 120.0]
        z: [-.inf, .inf]
      components: !ConstantMap
        map:
          nuc_xz: 25.0e6
    - !AxisAlignedCuboidalDomainFilter
      limits:
        x: [-.inf, .inf]
        y: [120.0, 220.0]
        z: [-.inf, .inf]
      components: !AffineMap
        matrix:
          nuc_xz: [0.0, -2.5e5, 0.0]
        translation:
          nuc_xz: 55.0e6
    - !AxisAlignedCuboidalDomainFilter
      limits:
        x: [-.inf, .inf]
        y: [-220.0, -120.0]
        z: [-.inf, .inf]
      components: !AffineMap
        matrix:
          nuc_xz: [0.0, 2.5e5, 0.0]
        translation:
          nuc_xz: 55.0e6
    - !ConstantMap
      map:
        nuc_xz: 0.0
