# The solid of material-elastic.yaml with strong attenuation, Qp = 40 and
# Qs = 20, so that a wave of the cases loses a percent of its amplitude within
# their steps: exp(-pi f t / Q) with f = 35 Hz and t = 2 ms. The moduli are
# those of the wave speeds at the central frequency of the band of the build
# (see SEISSOL_ANELASTIC_CENTRAL). Group 2, the far half of mat48, has half the
# moduli, as in material-elastic.yaml.
!Any
components:
  - !GroupFilter
    groups: 1
    components: !ConstantMap
      map:
        rho:    2700.0
        mu:     3.24e10
        lambda: 3.24e10
        Qp:     40.0
        Qs:     20.0
  - !GroupFilter
    groups: 2
    components: !ConstantMap
      map:
        rho:    2700.0
        mu:     1.62e10
        lambda: 1.62e10
        Qp:     40.0
        Qs:     20.0
