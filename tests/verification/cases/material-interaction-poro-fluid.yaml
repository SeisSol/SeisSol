# The sandstone of material-interaction-solid-poro.yaml in group 1, the near
# half of mat48, and the water of material-acoustic.yaml in group 2, the far
# half: the pores are open towards the water, but for a skin of the sandstone
# at the boundary of its group.
!Any
components:
  - !GroupFilter
    groups: 1
    components: !ConstantMap
      map:
        bulk_solid:   40.0e9
        rho:          2500.0
        lambda:       12.0e9
        mu:           10.0e9
        porosity:     0.2
        permeability: 6.0e-13
        tortuosity:   3.0
        bulk_fluid:   2.5e9
        rho_fluid:    1040.0
        viscosity:    0.001
        interface_conductance: 1.0e-7
  - !GroupFilter
    groups: 2
    components: !ConstantMap
      map:
        rho:    1000.0
        lambda: 2.25e9
