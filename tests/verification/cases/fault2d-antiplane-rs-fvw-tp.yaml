# The spontaneous antiplane rupture of fault2d-antiplane-rs-fvw.yaml with
# thermal pressurization, in the shear zone of fault1d-rs-fvw-tp.yaml, 2 w =
# 1 cm wide with a_hy = 4e-4 m^2/s, and with SEISSOL_TP of the parameter
# file. The frictional heating raises the temperature at the centre of the
# shear zone by up to 390 K and the pore pressure by up to 26 MPa, a fifth of
# the normal stress, which brings the front to y = 300 m 3 ms earlier than
# without, as antiplane.py computes it.

!Switch
[s_xx, s_yy, s_zz, s_xy, s_yz, s_xz, nuc_xx, nuc_yy, nuc_zz, nuc_xy, nuc_yz, rs_a, rs_sl0, rs_srW, tp_halfWidthShearZone, tp_hydraulicDiffusivity]: !ConstantMap
  map:
    s_xx:   -120.0e6
    s_yy:   0.0
    s_zz:   0.0
    s_xy:   0.0
    s_yz:   0.0
    s_xz:   40.0e6
    nuc_xx: 0.0
    nuc_yy: 0.0
    nuc_zz: 0.0
    nuc_xy: 0.0
    nuc_yz: 0.0
    rs_a:   0.004
    rs_sl0: 0.05
    rs_srW: 0.1
    tp_halfWidthShearZone:   0.005
    tp_hydraulicDiffusivity: 4.0e-4
[nuc_xz]: !Any
  components:
    - !AxisAlignedCuboidalDomainFilter
      limits:
        x: [-.inf, .inf]
        y: [-120.0, 120.0]
        z: [-.inf, .inf]
      components: !ConstantMap
        map:
          nuc_xz: 25.0e6
    - !AxisAlignedCuboidalDomainFilter
      limits:
        x: [-.inf, .inf]
        y: [120.0, 220.0]
        z: [-.inf, .inf]
      components: !AffineMap
        matrix:
          nuc_xz: [0.0, -2.5e5, 0.0]
        translation:
          nuc_xz: 55.0e6
    - !AxisAlignedCuboidalDomainFilter
      limits:
        x: [-.inf, .inf]
        y: [-220.0, -120.0]
        z: [-.inf, .inf]
      components: !AffineMap
        matrix:
          nuc_xz: [0.0, 2.5e5, 0.0]
        translation:
          nuc_xz: 55.0e6
    - !ConstantMap
      map:
        nuc_xz: 0.0
