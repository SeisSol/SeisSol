# Fast velocity weakening with thermal pressurization on fault1d, after TPV104
# and TPV105. The shear zone is narrow enough, 2 w = 1 cm, that the pore fluid
# diffuses across it within the run (w^2 / a_hy = 62.5 ms), so that the case
# leaves the undrained limit behind.
!ConstantMap
map:
  s_xx:   -120.0e6
  s_yy:   0.0
  s_zz:   0.0
  s_xy:   40.0e6
  s_yz:   0.0
  s_xz:   0.0
  nuc_xx: 0.0
  nuc_yy: 0.0
  nuc_zz: 0.0
  nuc_xy: 45.0e6
  nuc_yz: 0.0
  nuc_xz: 0.0
  rs_a:     0.01
  rs_sl0:   0.2
  rs_srW:   0.1
  tp_halfWidthShearZone:   0.005
  tp_hydraulicDiffusivity: 4.0e-4
