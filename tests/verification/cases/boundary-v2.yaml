# An easi boundary condition for the Dirichlet faces of the elastic material:
# the ghost state is the inner one with v2 raised by 1 mm/s, so that the faces
# drive a wave into a body at rest. A simulation can take it as a boundary
# condition of its own (BoundaryFileName<i>).
!ConstantMap
map:
  const_v2: 1.0e-3
