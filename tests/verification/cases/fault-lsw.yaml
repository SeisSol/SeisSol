# Linear slip weakening, after TPV5, with a short d_c so that the weakening
# branch is reached within the run. Strength mu_s * 120 MPa = 81.24 MPa lies
# between the initial 70 MPa and the 90 MPa reached with nucleation.
!ConstantMap
map:
  s_xx:   -120.0e6
  s_yy:   0.0
  s_zz:   0.0
  s_xy:   70.0e6
  s_yz:   0.0
  s_xz:   0.0
  nuc_xx: 0.0
  nuc_yy: 0.0
  nuc_zz: 0.0
  nuc_xy: 20.0e6
  nuc_yz: 0.0
  nuc_xz: 0.0
  mu_s:     0.677
  mu_d:     0.525
  d_c:      0.001
  cohesion: 0.0
