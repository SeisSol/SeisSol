# A sandstone saturated with water, as in material-interaction-solid-poro.yaml.
# Group 2, the far half of mat48, has a matrix of half the moduli.
!Any
components:
  - !GroupFilter
    groups: 1
    components: !ConstantMap
      map:
        bulk_solid:   40.0e9
        rho:          2500.0
        lambda:       12.0e9
        mu:           10.0e9
        porosity:     0.2
        permeability: 6.0e-13
        tortuosity:   3.0
        bulk_fluid:   2.5e9
        rho_fluid:    1040.0
        viscosity:    0.001
  - !GroupFilter
    groups: 2
    components: !ConstantMap
      map:
        bulk_solid:   40.0e9
        rho:          2500.0
        lambda:       6.0e9
        mu:           5.0e9
        porosity:     0.2
        permeability: 6.0e-13
        tortuosity:   3.0
        bulk_fluid:   2.5e9
        rho_fluid:    1040.0
        viscosity:    0.001
