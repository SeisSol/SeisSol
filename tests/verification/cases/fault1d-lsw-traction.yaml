# fault1d-lsw-oblique.yaml with its stresses as tractions in fault coordinates.
# On the fault x = 0, whose normal e_x points away from the reference point,
# the strike is -e_y and the dip -e_z, so that these are the same stresses
# there. On a turned fault, they are the tractions along its own strike and
# dip, which SeisSol turns into a stress face by face.
!ConstantMap
map:
  T_n:     -120.0e6
  T_s:     -70.0e6
  T_d:     -30.0e6
  Tnuc_n:  0.0
  Tnuc_s:  -20.0e6
  Tnuc_d:  0.0
  mu_s:     0.677
  mu_d:     0.525
  d_c:      0.08
  cohesion: 0.0
