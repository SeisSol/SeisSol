# The media of material-interaction-solid-fluid.yaml the other way round: the
# water in group 1, the near half of mat48, and the solid in group 2, the far
# half, also as the isotropic stiffness tensor that an anisotropic configuration
# reads. With the far half anisotropic, a run solves the same problem as with
# the far half elastic.
!Any
components:
  - !GroupFilter
    groups: 1
    components: !ConstantMap
      map:
        rho:    1000.0
        mu:     0.0
        lambda: 2.25e9
        Qp:     100.0
  - !GroupFilter
    groups: 2
    components: !ConstantMap
      map:
        rho:    2700.0
        mu:     3.24e10
        lambda: 3.24e10
        Qp:     120.0
        Qs:     60.0
        c11: 9.72e+10
        c12: 3.24e+10
        c13: 3.24e+10
        c14: 0
        c15: 0
        c16: 0
        c22: 9.72e+10
        c23: 3.24e+10
        c24: 0
        c25: 0
        c26: 0
        c33: 9.72e+10
        c34: 0
        c35: 0
        c36: 0
        c44: 3.24e+10
        c45: 0
        c46: 0
        c55: 3.24e+10
        c56: 0
        c66: 3.24e+10
