# The sandstone of material-interaction-solid-poro.yaml in group 1, the near
# half of mat48, and a more porous one in group 2, the far half: both groups
# have a skin of a conductance so large that the pore pressure is continuous
# across the boundary of the groups, apart from rounding.
!Any
components:
  - !GroupFilter
    groups: 1
    components: !ConstantMap
      map:
        bulk_solid:   40.0e9
        rho:          2500.0
        lambda:       12.0e9
        mu:           10.0e9
        porosity:     0.2
        permeability: 6.0e-13
        tortuosity:   3.0
        bulk_fluid:   2.5e9
        rho_fluid:    1040.0
        viscosity:    0.001
        interface_conductance: 1.0e30
  - !GroupFilter
    groups: 2
    components: !ConstantMap
      map:
        bulk_solid:   30.0e9
        rho:          2600.0
        lambda:       10.0e9
        mu:           10.0e9
        porosity:     0.3
        permeability: 1.0e-13
        tortuosity:   3.0
        bulk_fluid:   2.5e9
        rho_fluid:    1040.0
        viscosity:    0.001
        interface_conductance: 1.0e30
