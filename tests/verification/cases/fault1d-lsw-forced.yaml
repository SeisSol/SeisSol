# Linear slip weakening on fault1d, broken by the forced rupture time alone: the
# cases using this file delay the nucleation past the end of the run. From the
# forced rupture time on, the friction weakens over t_0, and the fault starts
# to slip once the strength has fallen below the 70 MPa it carries.
!ConstantMap
map:
  s_xx:   -120.0e6
  s_yy:   0.0
  s_zz:   0.0
  s_xy:   70.0e6
  s_yz:   0.0
  s_xz:   0.0
  nuc_xx: 0.0
  nuc_yy: 0.0
  nuc_zz: 0.0
  nuc_xy: 20.0e6
  nuc_yz: 0.0
  nuc_xz: 0.0
  mu_s:     0.677
  mu_d:     0.525
  d_c:      0.08
  cohesion: 0.0
  forced_rupture_time: 3.125e-02
