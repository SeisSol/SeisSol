# Severe velocity weakening with thermal pressurization on fault1d, with the
# shear zone of the strong velocity weakening case. The prestress lies inside
# the range the law holds at the initial slip rate in a non-negative state, so
# that the state starts at 5 L, and the nucleation drives the fault from creep
# to several metres per second while the state grows with the slip.
!ConstantMap
map:
  s_xx:   -120.0e6
  s_yy:   0.0
  s_zz:   0.0
  s_xy:   70.8e6
  s_yz:   0.0
  s_xz:   0.0
  nuc_xx: 0.0
  nuc_yy: 0.0
  nuc_zz: 0.0
  nuc_xy: 40.0e6
  nuc_yz: 0.0
  nuc_xz: 0.0
  rs_a:     0.008
  rs_sl0:   0.02
  tp_halfWidthShearZone:   0.005
  tp_hydraulicDiffusivity: 4.0e-4
