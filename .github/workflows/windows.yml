name: windows
on:
  - push

# a push to a branch replaces the run of the push before it; on master, every push runs to its end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name == 'master' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  HDF5_VERSION: 2.2.0

jobs:
  windows:
    name: build-windows
    runs-on: windows-2025
    defaults:
      run:
        # MSYS2 provides the (MinGW-based) toolchain and most dependencies
        shell: msys2 {0}
    steps:
      # keep the files as they are in the repository (i.e. no CRLF conversion)
      - name: setup-git
        shell: pwsh
        run: |
          git config --global core.autocrlf false

      # As on macOS, the code generators and the verification tests take a Python of their own,
      # with all their packages from pip. Its h5py brings an HDF5 of its own, which keeps apart
      # from the one with MPI that is built below.
      - id: setup-python
        name: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # the MS-MPI runtime (msmpi.dll and mpiexec; sets MSMPI_BIN);
      # the headers and the import library for MinGW come from MSYS2
      - name: install-msmpi
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi

      - name: install-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
          # (Fortran and LAPACK for the poroelastic configurations)
          pacboy: >-
            cc:p
            fc:p
            omp:p
            cmake:p
            ninja:p
            eigen3:p
            yaml-cpp:p
            msmpi:p
            zlib:p
            lapack:p

      - name: setup-environment
        run: |
          # everything built here goes into this folder
          DEPS="$(cygpath -m "${RUNNER_TEMP}/dependencies")"
          echo "DEPS=${DEPS}" >> "${GITHUB_ENV}"

          PYTHON="$(cygpath -m '${{ steps.setup-python.outputs.python-path }}')"
          echo "PYTHON=${PYTHON}" >> "${GITHUB_ENV}"

          # use the MS-MPI SDK from MSYS2; and point CMake to it explicitly (without asking
          # any compiler wrapper), since FindMPI may pick up an MSVC-only installation otherwise
          PREFIX="$(cygpath -m "${MINGW_PREFIX}")"
          echo "MPI_HINTS=-DMPI_SKIP_COMPILER_WRAPPER=ON -DMPI_C_HEADER_DIR=${PREFIX}/include -DMPI_CXX_HEADER_DIR=${PREFIX}/include -DMPI_C_LIB_NAMES=msmpi -DMPI_CXX_LIB_NAMES=msmpi -DMPI_msmpi_LIBRARY=${PREFIX}/lib/libmsmpi.dll.a -DMPI_CXX_SKIP_MPICXX=ON" >> "${GITHUB_ENV}"

      - name: install-python-packages
        run: |
          # numpy and scipy for the code generators, h5py for the verification tests, which write
          # their meshes with it
          "${PYTHON}" -m pip install numpy scipy h5py git+https://github.com/SeisSol/PSpaMM.git

      - name: cache-hdf5
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dependencies/hdf5
          key: hdf5-${{ env.HDF5_VERSION }}-msmpi-ucrt64-v1

      # MSYS2 only packages a serial HDF5; SeisSol needs a parallel one
      - name: build-hdf5
        if: ${{ steps.cache-hdf5.outputs.cache-hit != 'true' }}
        run: |
          git clone --depth 1 --branch ${HDF5_VERSION} https://github.com/HDFGroup/hdf5.git hdf5
          cmake -S hdf5 -B hdf5-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${DEPS}/hdf5 \
            ${MPI_HINTS} \
            -DHDF5_ENABLE_PARALLEL=ON \
            -DHDF5_ENABLE_ZLIB_SUPPORT=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_TOOLS=OFF \
            -DHDF5_BUILD_UTILS=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF \
            -DHDF5_BUILD_HL_LIB=ON
          ninja -C hdf5-build install

      - name: checkout-easi
        uses: actions/checkout@v6
        with:
          repository: SeisSol/easi
          path: easi

      - name: build-easi
        run: |
          cmake -S easi -B easi-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${DEPS}/easi \
            -DASAGI=OFF \
            -DLUA=OFF \
            -DEASICUBE=OFF \
            -DIMPALAJIT=OFF
          ninja -C easi-build install

      - id: checkout
        name: checkout-seissol
        uses: actions/checkout@v6
        with:
          path: seissol
          submodules: recursive

      - id: build
        name: build-seissol
        run: |
          # the tests are run once after linking them (to collect the test cases);
          # hence, the HDF5 DLLs and mpiexec are already needed here. pspamm-generator
          # lies next to the Python
          PATH="$(cygpath -u "${DEPS}/hdf5/bin"):${PATH}:$(cygpath -u "${MSMPI_BIN}"):$(dirname "$(cygpath -u "${PYTHON}")")/Scripts"
          export PATH

          cmake --version

          # run w/o netcdf, as on macOS. The snapshot references of the verification tests come
          # from another environment, which this one deviates from by rounding; they run in the
          # first configuration only. No NUMA-aware pinning (it is Linux-only), and mpiexec for
          # the MPI tests, by default
          cmake -S seissol -B build -GNinja \
            -DCMAKE_PREFIX_PATH="${DEPS}/hdf5;${DEPS}/easi" \
            ${MPI_HINTS} \
            -DGEMM_TOOLS_LIST=PSpaMM \
            -DNETCDF=OFF \
            -DCOVERAGE=OFF \
            -DTESTING=ON \
            -DTESTING_GENERATED=ON \
            -DHOST_ARCH=hsw \
            -DCMAKE_BUILD_TYPE=Release \
            -DCONFIGS=ci-cpu \
            -DGRAPH_PARTITIONING_LIBS=none \
            -DSEISSOL_SNAPSHOT_TOLERANCE_DOUBLE=1e-9 \
            -DSEISSOL_VERIFICATION_CONFIGS=first \
            -DPython3_EXECUTABLE="${PYTHON}"

          # one compile job per core: a translation unit of the set takes up to 1.6 GB
          ninja -C build -j "$(nproc)"

      - name: seissol-test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          PATH="$(cygpath -u "${DEPS}/hdf5/bin"):${PATH}:$(cygpath -u "${MSMPI_BIN}")"
          export PATH

          cd build || exit 1
          ctest -j --rerun-failed --output-on-failure
