name: coverage
on:
  - push

# a push to a branch replaces the run of the push before it; on master, every push runs to its end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name == 'master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-26.04
    steps:
      - name: apt-get
        run: |
          sudo apt-get update
          sudo apt-get install lcov ninja-build hdf5-tools libeigen3-dev libhdf5-openmpi-dev libomp-dev libopenmpi-dev libptscotch-dev libyaml-cpp-dev openmpi-bin openmpi-common python3 python3-pip

          # h5py for the verification tests, which write their meshes with it
          sudo pip3 install setuptools numpy h5py --break-system-packages
          sudo mkdir -p /opt/dependencies
          sudo chown "$(id -u):$(id -g)" /opt/dependencies

      - id: checkout
        name: checkout-seissol
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: checkout-easi
        uses: actions/checkout@v6
        with:
          repository: SeisSol/easi
          path: easi

      - name: build-easi
        run: scripts/ci/build-easi.sh easi /opt/dependencies

      # (the steps of the job are in scripts/ci/jobs/coverage.sh, which runs them locally as well)
      - id: build
        name: build-seissol
        env:
          CC: gcc-15
          CXX: g++-15
        run: scripts/ci/jobs/coverage.sh build

      - name: seissol-coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/ci/jobs/coverage.sh coverage

      - name: upload-seissol-coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: seissol-coverage
          path: build/seissol-coverage
