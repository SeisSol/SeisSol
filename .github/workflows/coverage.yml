name: coverage
on:
  - push

# a push to a branch replaces the run of the push before it; on master, every push runs to its end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name == 'master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-26.04
    steps:
      - name: apt-get
        run: |
          sudo apt-get update
          sudo apt-get install lcov ninja-build hdf5-tools libeigen3-dev libhdf5-openmpi-dev libomp-dev libopenmpi-dev libptscotch-dev libyaml-cpp-dev openmpi-bin openmpi-common python3 python3-pip libblas-dev liblapack-dev liblapacke-dev

          # h5py for the verification tests, which write their meshes with it
          sudo pip3 install setuptools numpy h5py --break-system-packages
          sudo mkdir -p /opt/dependencies

      - name: checkout-easi
        uses: actions/checkout@master
        with:
          repository: SeisSol/easi

      - name: build-easi
        run: |
          mkdir build && cd build
          CMAKE_PREFIX_PATH=/opt/dependencies cmake .. -GNinja -DCMAKE_INSTALL_PREFIX=/opt/dependencies -DASAGI=OFF -DLUA=OFF -DEASICUBE=OFF -DIMPALAJIT=OFF
          ninja install

      - id: checkout
        name: checkout-seissol
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - id: build
        name: build-seissol
        run: |
          mkdir build && cd build

          export CC=gcc-15
          export CXX=g++-15
          export FC=gfortran-15

          mkdir -p /opt/seissol

          # allow oversubscribe and run as root for OpenMPI
          export OMPI_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

          # run w/o netcdf for consistency with the clang-tidy check; the configurations of the CPU
          # tests (cmake/confignames.cmake), so that the code of every material counts. The snapshot
          # references of the verification tests come from another environment, which this one
          # deviates from by rounding, as the CPU CI (scripts/compile/compile-variants.yaml). The
          # verification cases run in the first configuration only, since in this unoptimized
          # build, the ones of all configurations would take hours; the CPU CI runs them all
          export CMAKE_PREFIX_PATH=/opt/dependencies
          cmake .. -GNinja -DCMAKE_INSTALL_PREFIX=/opt/seissol -DGEMM_TOOLS_LIST=none -DNETCDF=OFF -DCOVERAGE=ON -DTESTING=ON -DTESTING_GENERATED=ON -DHOST_ARCH=hsw -DCMAKE_BUILD_TYPE=Debug -DCONFIGS=ci-cpu -DGRAPH_PARTITIONING_LIBS=ptscotch -DSEISSOL_SNAPSHOT_TOLERANCE_DOUBLE=1e-9 -DSEISSOL_VERIFICATION_CONFIGS=first
          ninja

      - name: seissol-coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # allow oversubscribe and run as root for OpenMPI
          export OMPI_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

          cd build
          ninja seissol-coverage

      - name: upload-seissol-coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: seissol-coverage
          path: build/seissol-coverage
