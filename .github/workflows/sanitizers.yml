name: sanitizers
on:
  - push
  - workflow_dispatch

# a push to a branch replaces the run of the push before it; on master, every push runs to its end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name == 'master' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build SeisSol with the sanitizers of cmake/sanitizers.cmake and run its tests in the runtime
  # options of .ci/sanitizers/environment.sh; a report fails the test it comes from, also one that
  # expects SeisSol to stop with an error.
  #
  # Both run all tests but the convergence cases, which run what the smoke cases run, for more
  # steps. The address sanitizer and UBSan run with GCC, in the configurations of the set
  # ci-sanitize. The thread sanitizer runs with Clang, whose OpenMP runtime tells it how its threads
  # synchronize (Archer), in one configuration; there, a run of several ranks communicates in a
  # thread of its own, and every run writes its output from a thread of its own, which no other
  # job of the CI does.
  #
  # The kernels are generated by yateto alone (GEMM_TOOLS_LIST=none): the code of PSpaMM and
  # LIBXSMM is assembly that no sanitizer sees into. The build keeps its assertions, optimized with
  # -O1 as the sanitizers recommend, and with line tables as its only debug information, which is
  # what the reports need: with full debug information, GCC takes about twenty times as long for
  # the generated kernels.
  # ---------------------------------------------------------------------------
  sanitizer:
    name: sanitizer<${{ matrix.setup.name }}>
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        setup:
          - name: address-undefined
            sanitizers: address;undefined
            cc: gcc
            cxx: g++
            # the indices into the containers of libstdc++ as well: the address sanitizer sees the
            # memory a container holds, not how much of it is in use
            cxx-flags: -D_GLIBCXX_ASSERTIONS
            configs: ci-sanitize
            testing-generated: 'ON'
            threads: false
          - name: thread
            sanitizers: thread
            cc: clang
            cxx: clang++
            cxx-flags: ''
            configs: elastic-linearck-o6-f64-stroud
            # the generated kernels run on one thread
            testing-generated: 'OFF'
            threads: true
    steps:
      - name: apt-get
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build hdf5-tools libeigen3-dev libhdf5-openmpi-dev libomp-dev libopenmpi-dev libyaml-cpp-dev openmpi-bin openmpi-common python3 python3-pip libblas-dev liblapack-dev liblapacke-dev clang gfortran

          # h5py for the verification tests, which write their meshes with it
          sudo pip3 install setuptools numpy h5py --break-system-packages
          sudo mkdir -p /opt/dependencies

      - name: checkout-easi
        uses: actions/checkout@v6
        with:
          repository: SeisSol/easi

      - name: build-easi
        run: |
          # not sanitized: the sanitizers are here for SeisSol
          mkdir build && cd build
          CMAKE_PREFIX_PATH=/opt/dependencies cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/dependencies -DASAGI=OFF -DLUA=OFF -DEASICUBE=OFF -DIMPALAJIT=OFF
          sudo ninja install

      - id: checkout
        name: checkout-seissol
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - id: build
        name: build-seissol
        run: |
          mkdir build && cd build

          export CC=${{ matrix.setup.cc }}
          export CXX=${{ matrix.setup.cxx }}
          export CMAKE_PREFIX_PATH=/opt/dependencies

          # allow oversubscribe for OpenMPI (needed for test discovery)
          export OMPI_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe

          # The verification cases run in each configuration of the build, with a limit raised for
          # the time they take with sanitizers. The snapshot references come from another
          # environment, which this one deviates from by rounding, as the CPU CI
          # (scripts/compile/compile-variants.yaml).
          cmake .. -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${{ matrix.setup.cxx-flags }}" \
            -DCMAKE_C_FLAGS_DEBUG="-O1 -g1" \
            -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g1" \
            -DSANITIZERS="${{ matrix.setup.sanitizers }}" \
            -DCONFIGS=${{ matrix.setup.configs }} \
            -DGEMM_TOOLS_LIST=none \
            -DHOST_ARCH=hsw \
            -DNETCDF=OFF \
            -DGRAPH_PARTITIONING_LIBS=none \
            -DNUMA_AWARE_PINNING=OFF \
            -DTESTING=ON \
            -DTESTING_GENERATED=${{ matrix.setup.testing-generated }} \
            -DSEISSOL_SNAPSHOT_TOLERANCE_DOUBLE=1e-9 \
            -DSEISSOL_MINITEST_TIMEOUT=3600

          # a translation unit takes up to 4.5 GB with the sanitizers of GCC and all configurations
          ninja -j 4

      - id: test
        name: test-seissol
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # allow oversubscribe for OpenMPI
          export OMPI_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe

          export CXX=${{ matrix.setup.cxx }}
          source .ci/sanitizers/environment.sh

          if [ "${{ matrix.setup.threads }}" = true ]; then
            # A run of several ranks communicates in a thread of its own, and every run writes its
            # output from one; on the runner, with as many ranks and threads as CPUs, they share
            # the CPUs of the workers, one CPU for each rank of a node (SEISSOL_FREE_CPUS_MASK).
            cpus=$(nproc)
            mask=""
            for rank in $(seq 0 $(( (cpus > 4 ? cpus : 4) - 1 ))); do
              mask="${mask:+${mask},}$(( rank % cpus ))"
            done
            export SEISSOL_COMMTHREAD=1
            export SEISSOL_FREE_CPUS_MASK="${mask}"
            export ASYNC_MODE=THREAD
          fi

          cd build
          ctest -j $(nproc) -LE convergence --output-on-failure --output-junit junit.xml

      - name: upload-test-logs
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: sanitizer-${{ matrix.setup.name }}-logs
          path: |
            build/junit*.xml
            build/Testing/Temporary/LastTest*.log
            build/tests/verification/*/work/*/seissol.log
          if-no-files-found: ignore
