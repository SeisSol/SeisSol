name: build-seissol-cpu
on:
  push:
  # a run started by hand verifies its branch as well, not only master
  workflow_dispatch:
    inputs:
      perf-repetitions:
        description: How often the performance job measures each kernel (many, to see the noise)
        default: '5'

# a push to a branch replaces the run of the push before it; on master, every push runs to its end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name == 'master' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  precomputed-hash: bed56573928e224984f5e75a17feb8b0b2f5ea27

jobs:
  # ---------------------------------------------------------------------------
  # Build SeisSol once per compiler, as master does: one executable of all
  # configurations of the set ci-cpu (scripts/compile/compile-variants.yaml),
  # whose tests run the verification cases in each of them.
  # ---------------------------------------------------------------------------
  seissol-build-test:
    name: seissol-build-test<${{matrix.setup.name}}, ${{matrix.arch}}, ${{matrix.build_type}}>
    runs-on: ubuntu-26.04
    # Docker gives a container 64 MB of /dev/shm, which is less than Intel MPI takes for a job of
    # four ranks; Open MPI falls back to a file elsewhere, Intel MPI fails
    container:
      image: ${{ matrix.setup.container }}
      options: --shm-size=2g
    strategy:
      fail-fast: false
      matrix:
        arch:
          - hsw
        build_type:
          - Release
          #- Debug
        # `name` selects the entry from the `toolchains:` block in
        # scripts/compile/compile-variants.yaml; the compiler itself is a
        # property of the container image, which is why it stays here and not
        # in the variant-set file. `werror` sets WARNINGS_AS_ERRORS, for the
        # compilers that compile the code of SeisSol without warnings.
        setup:
          - name: gcc-13
            container: seissol/gha-cpu:davschneller-gpu-image
            parallel-builds: 1
            pythonbreak: true
            werror: "ON"
          - name: clang-19
            container: seissol/gha-cpu:davschneller-gpu-image
            parallel-builds: 1
            pythonbreak: true
            werror: "ON"
          - name: icx-2024
            container: seissol/gha-gpu-intel:davschneller-gpu-image
            parallel-builds: 1
            pythonbreak: false
            werror: "OFF"
          - name: nvhpc
            container: seissol/gha-gpu-nvhpc:davschneller-gpu-image
            parallel-builds: 1
            pythonbreak: true
            werror: "OFF"
    steps:
      - name: setup
        run: |
          # h5py for the verification tests, which write their meshes with it; the images have numpy
          if [ "${{ matrix.setup.pythonbreak }}" = false ]; then
            # the Intel image still works with an older Python version. Hence, use the following hack.
            pip3 install pyyaml h5py
          else
            pip3 install --break-system-packages pyyaml h5py
          fi

      - id: checkout
        name: checkout-seissol
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: build-variants
        id: build
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |

          # allow oversubscribe and run as root for OpenMPI
          export OMPI_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_base_oversubscribe=1
          export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

          python3 scripts/compile/compile_variants.py \
            --preset ci-cpu \
            --toolchain ${{ matrix.setup.name }} \
            --set defines.WARNINGS_AS_ERRORS=${{ matrix.setup.werror }} \
            --install-prefix /opt/seissol \
            --max-parallel ${{ matrix.setup.parallel-builds }} \
            --report build-report.json

      - name: upload-build-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          name: build-report-${{matrix.build_type}}-${{matrix.arch}}-${{matrix.setup.name}}
          path: build-report.json
          if-no-files-found: ignore

      - name: upload-seissol
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          name: seissol-${{matrix.build_type}}-${{matrix.arch}}-${{matrix.setup.name}}
          path: /opt/seissol

  # ---------------------------------------------------------------------------
  # Per (compiler) × (parallel mode): run SeisSol and
  # verify against the precomputed reference. All five compare-* dispatches
  # plus the run itself live inside verify.py; tpv-data.json controls
  # which categories actually fire per case. A case runs the executable of the
  # build in its configuration, which verify.py chooses with
  # SEISSOL_CONFIGURATION.
  # ---------------------------------------------------------------------------
  seissol-run-test:
    name: seissol-run-test<${{matrix.setup.name}}, ${{matrix.arch}}, ${{matrix.build_type}}><r${{matrix.parallel.ranks}}×t${{matrix.parallel.threads}}>
    runs-on: self-hosted #ubuntu-26.04
    # the shared memory MPI needs, as for the build job
    container:
      image: ${{ matrix.setup.container }}
      options: --shm-size=2g
    needs: seissol-build-test
    # Only on master for now, and in runs started by hand: the runner takes one job at a time, so
    # the verification of every push queued up behind that of the pushes before it. It runs
    # whatever the builds end in: a build whose tests failed has installed and uploaded SeisSol
    # before running them, a failed build of another leg (as of NVHPC, which is not verified) holds
    # back none of the others, and a leg whose own build failed finds no executable to download.
    if: ${{ !cancelled() && github.repository == 'SeisSol/SeisSol' && (github.ref_name == 'master' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        order:
          - 6
        arch:
          - hsw
        build_type:
          - Release
        setup:
          - cc: gcc-13
            cxx: g++-13
            fc: gfortran-13
            container: seissol/gha-cpu:davschneller-gpu-image
            pythonbreak: true
            mpi: openmpi
            name: gcc-13
          - cc: clang-19
            cxx: clang++-19
            fc: gfortran-13 # TODO?
            container: seissol/gha-cpu:davschneller-gpu-image
            pythonbreak: true
            mpi: openmpi
            name: clang-19
          - cc: icx
            cxx: icpx
            fc: ifx
            container: seissol/gha-gpu-intel:davschneller-gpu-image
            pythonbreak: false
            mpi: intel
            name: icx-2024
          #- cc: nvc
          #  cxx: nvc++
          #  fc: nvfortran
          #  container: seissol/gha-gpu-nvhpc:davschneller-gpu-image
          #  pythonbreak: true
          #  mpi: openmpi
        parallel:
          - ranks: 1
            threads: 12
            commthread: false
          - ranks: 12
            threads: 1
            commthread: false
    steps:
      - name: clean-workspace
        run: |
          # A self-hosted runner keeps the workspace of the repository from one job to the next, of
          # every workflow and branch: what an earlier job downloaded to install/ would stay next to
          # the executable of this build, and verify.py takes an executable seissol-<configuration>
          # before the shared seissol. Nor may the report of an earlier job pass for this one's,
          # should verify.py stop before writing its own.
          rm -rf install report.txt

      - name: install-packages
        run: |
          # circumvent problems with the Intel image still using Ubuntu 22.04
          if [ "${{ matrix.setup.pythonbreak }}" = true ]; then
            pip3 install --break-system-packages "numpy>=1.12.0" lxml==5.0.0 setuptools seissolxdmf h5py pandas jq
          else
            pip3 install "numpy>=1.12.0" lxml==5.0.0 setuptools seissolxdmf h5py pandas jq
          fi

      - name: get-precomputed-solutions
        uses: actions/checkout@v6
        with:
          repository: seissol/precomputed-seissol
          ref: ${{ env.precomputed-hash }}
          path: precomputed

      # The compare-*.py / verify.py scripts live in this very repo. The
      # workflow itself doesn't auto-checkout, so we do it explicitly here.
      - name: get-verification-scripts
        uses: actions/checkout@v6
        with:
          path: seissol-scripts
          sparse-checkout: scripts/validate
          sparse-checkout-cone-mode: false

      - name: get-seissol
        id: get-seissol
        uses: actions/download-artifact@v8
        with:
          name: seissol-${{matrix.build_type}}-${{matrix.arch}}-${{matrix.setup.name}}
          path: install

      - name: verify
        id: verify
        run: |
          MPI_OPTIONS=""
          if [ "${{ matrix.setup.mpi }}" = openmpi ]; then
            MPI_OPTIONS="--oversubscribe --allow-run-as-root -bind-to none"
          fi

          export PATH=$(pwd)/install/bin:$PATH
          export LD_LIBRARY_PATH=$(pwd)/install/lib:$(pwd)/install/lib64:${LD_LIBRARY_PATH:-}
          chmod +x $(pwd)/install/bin/*
          # the executables verify.py chooses from
          ls -l $(pwd)/install/bin

          export OMP_NUM_THREADS=${{ matrix.parallel.threads }}
          export SEISSOL_COMMTHREAD=${{ matrix.parallel.commthread }}
          export SEISSOL_MINI_NUM_ELEMENTS=100

          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          export OMPI_MCA_rmaps_base_oversubscribe=true

          python3 $GITHUB_WORKSPACE/seissol-scripts/scripts/validate/verify.py \
            --precomputed-dir precomputed \
            --binary-dir $GITHUB_WORKSPACE/install \
            --all \
            --mpi-cmd mpirun \
            --mpi-args "${MPI_OPTIONS}" \
            --ranks ${{ matrix.parallel.ranks }} \
            --threads ${{ matrix.parallel.threads }} \
            --color always \
            --report report.txt

      - name: upload-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.setup.name }}-r${{ matrix.parallel.ranks }}t${{ matrix.parallel.threads }}
          path: report.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Measure the kernels with the proxy of the GCC build on the self-hosted runner
  # (scripts/perf/benchmark.py), in all configurations of the set ci-cpu, and
  # compare them with the last measurement of master on the same runner, which
  # the cache keeps. The comparison goes into the step summary and does not fail
  # the job: whether the runner measures steadily enough for that is what a run
  # started by hand with many repetitions tells (the spread it reports).
  # ---------------------------------------------------------------------------
  seissol-perf:
    name: seissol-perf<gcc-13, hsw, Release>
    runs-on: self-hosted
    container:
      image: seissol/gha-cpu:davschneller-gpu-image
    needs: seissol-build-test
    # on master and in runs started by hand only, as the verification: the runner takes one job at a
    # time, which keeps the measurement apart from the other jobs as well
    if: ${{ !cancelled() && github.repository == 'SeisSol/SeisSol' && (github.ref_name == 'master' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # as many threads as a verification run of one rank, each on a core of its own
      OMP_NUM_THREADS: 12
      OMP_PLACES: cores
      OMP_PROC_BIND: close
    steps:
      - name: clean-workspace
        run: |
          # the workspace of a self-hosted runner outlives the job (see seissol-run-test)
          rm -rf install perf

      - name: get-benchmark-script
        uses: actions/checkout@v6
        with:
          path: seissol-scripts
          sparse-checkout: scripts/perf
          sparse-checkout-cone-mode: false

      - name: get-seissol
        uses: actions/download-artifact@v8
        with:
          name: seissol-Release-hsw-gcc-13
          path: install

      - name: get-baseline
        uses: actions/cache/restore@v5
        with:
          path: perf/baseline.json
          # never there: the newest one of the runner is taken
          key: seissol-perf-${{ runner.name }}-${{ github.run_id }}
          restore-keys: seissol-perf-${{ runner.name }}-

      - name: measure
        run: |
          chmod +x install/bin/*
          export LD_LIBRARY_PATH=$(pwd)/install/lib:$(pwd)/install/lib64:${LD_LIBRARY_PATH:-}
          mkdir -p perf
          python3 seissol-scripts/scripts/perf/benchmark.py run \
            --proxy install/bin/proxyseissol \
            --cells 20000 \
            --timesteps 10 \
            --repetitions ${{ inputs.perf-repetitions || 5 }} \
            --warmup 1 \
            --output perf/current.json \
            --github-benchmark perf/github-benchmark.json
          python3 seissol-scripts/scripts/perf/benchmark.py noise perf/current.json

      - name: compare
        run: |
          if [ -f perf/baseline.json ]; then
            python3 seissol-scripts/scripts/perf/benchmark.py compare \
              --baseline perf/baseline.json \
              --current perf/current.json \
              --summary "${GITHUB_STEP_SUMMARY}"
          else
            echo "No measurement of master on ${{ runner.name }} to compare with." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: keep-baseline
        if: ${{ github.ref_name == 'master' }}
        run: cp perf/current.json perf/baseline.json

      - name: save-baseline
        if: ${{ github.ref_name == 'master' }}
        uses: actions/cache/save@v5
        with:
          path: perf/baseline.json
          key: seissol-perf-${{ runner.name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: upload-measurement
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: perf-gcc-13
          path: perf/
          if-no-files-found: ignore
