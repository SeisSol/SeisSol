name: clang-tidy
on:
  - push

jobs:
  clang-tidy:
    name: clang-tidy (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # with the set ci-cpu, clang-tidy takes about three and a half times as long as with one
        # configuration; four jobs share the translation units (TIDY_SHARD of .ci/tidy.sh)
        shard: [0, 1, 2, 3]
    steps:
      - name: apt-get
        run: |
          sudo apt-get update
          sudo apt-get install hdf5-tools libeigen3-dev libhdf5-openmpi-dev libomp-dev libopenmpi-dev libptscotch-dev libyaml-cpp-dev openmpi-bin openmpi-common python3 python3-pip libblas-dev liblapack-dev liblapacke-dev

          # fetch the latest clang-tidy manually from the LLVM sources; since that's usually not provided in the Ubuntu default repos. (and we update the clang-tidy version more often than there are Ubuntu-LTS releases)

          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository "deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main"
          sudo add-apt-repository "deb-src http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main"
          sudo apt-get update

          sudo apt-get -y install clang-22 clang-tidy-22 libomp-22-dev

          sudo pip3 install numpy --break-system-packages
          sudo mkdir -p /opt/dependencies

      - name: checkout-easi
        uses: actions/checkout@master
        with:
          repository: SeisSol/easi

      - name: build-easi
        run: |
          mkdir build && cd build
          CMAKE_PREFIX_PATH=/opt/dependencies cmake .. -DCMAKE_INSTALL_PREFIX=/opt/dependencies -DASAGI=OFF -DLUA=OFF -DEASICUBE=OFF -DIMPALAJIT=OFF
          make -j $(nproc) && make install

      - name: checkout-seissol
        uses: actions/checkout@v6
        with:
          repository: SeisSol/SeisSol

      - name: clang-tidy
        run: |
          set -euo pipefail
          clang-tidy-22 --version
          which clang-tidy-22
          git submodule update --init
          mkdir -p build && cd build
          CMAKE_PREFIX_PATH=/opt/dependencies cmake -DGEMM_TOOLS_LIST=none -DNETCDF=OFF -DASAGI=OFF -DHDF5=ON -DCMAKE_BUILD_TYPE=Debug -DTESTING=ON -DLOG_LEVEL=warning -DLOG_LEVEL_MASTER=info -DHOST_ARCH=hsw -DCONFIGS=ci-cpu -DTESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGRAPH_PARTITIONING_LIBS=ptscotch ..
          make -j $(nproc) seissol-codegen
          # clang-tidy can not handle -fprofile-abs-path, so we remove it from the compile commands.
          sed -i 's/-fprofile-abs-path //g' compile_commands.json
          TIDY_SHARD=${{ matrix.shard }}/4 ../.ci/tidy.sh ../ ./ -clang-tidy-binary=$(which clang-tidy-22) -quiet -j $(nproc)

  clang-tidy-gpu:
    name: clang-tidy-gpu (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    # the image of the CUDA jobs of the GPU CI, for its AdaptiveCpp: with DEVICE_BACKEND=acpp, the
    # SYCL kernels are translation units of the build like all others, so clang-tidy reads them all.
    # It compiles nothing, so the device of the build needs neither a GPU nor a device compiler; the
    # kernels are generated for sm_75 (for generic, TensorForge cannot generate the set ci-gpu).
    container: seissol/gha-gpu-nv:davschneller-gpu-image
    strategy:
      fail-fast: false
      matrix:
        # the configurations of the GPU tests (ci-gpu), the translation units shared out as in the
        # CPU job
        shard: [0, 1, 2, 3]
    steps:
      - name: apt-get
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
          apt-get update
          apt-get -y install clang-tidy-22 libomp-22-dev
          ln -sf "$(which run-clang-tidy-22)" /usr/local/bin/run-clang-tidy

          pip3 install --break-system-packages git+https://github.com/seissol/tensorforge.git

      - name: checkout-seissol
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: clang-tidy
        # a step in a container runs in sh by default, which has no pipefail
        shell: bash
        run: |
          set -euo pipefail
          clang-tidy-22 --version
          mkdir -p build && cd build
          CC=gcc CXX=g++ cmake .. -GNinja -DCMAKE_BUILD_TYPE=Debug -DTESTING=ON -DLOG_LEVEL=warning -DLOG_LEVEL_MASTER=info -DHOST_ARCH=hsw -DGEMM_TOOLS_LIST=none -DNETCDF=OFF -DASAGI=OFF -DHDF5=ON -DDEVICE_BACKEND=acpp -DDEVICE_ARCH=sm_75 -DDEVICE_CODEGEN=tensorforge -DCONFIGS=ci-gpu -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja seissol-codegen
          TIDY_SHARD=${{ matrix.shard }}/4 ../.ci/tidy.sh ../ ./ -clang-tidy-binary=$(which clang-tidy-22) -quiet -j $(nproc)
