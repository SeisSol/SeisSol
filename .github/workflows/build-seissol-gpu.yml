name: build-seissol-gpu
on:
  - push

env:
  precomputed-hash: a8a82bc23a921d22c257eab6f70a17e1e0f49b60

jobs:
  seissol-build-test:
    name: seissol-build-test<${{matrix.setup.name}}, ${{matrix.setup.backend}}, ${{matrix.setup.arch}}, ${{matrix.build_type}}>
    runs-on: ubuntu-26.04
    container: ${{ matrix.setup.container }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        arch:
          - hsw
        build_type:
          - Release
          #- Debug
        # `name` selects the entry from the `toolchains:` block in
        # scripts/compile/compile-variants.yaml.
        setup:
          - arch: sm_60
            backend: cuda
            name: gcc-13
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: sm_60
            backend: cuda
            name: clang-18
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: gfx906
            backend: hip
            name: gcc-13
            container: seissol/gha-gpu-amd:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: gfx906
            backend: hip
            name: clang-18
            container: seissol/gha-gpu-amd:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: skl
            backend: oneapi
            name: icx-2024
            container: seissol/gha-gpu-intel:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: false
    steps:
      - name: setup
        run: |
          if [ "${{ matrix.setup.pythonbreak }}" = false ]; then
            # the Intel image still works with an older Python version. Hence, use the following hack.
            pip3 install pyyaml
            git clone https://github.com/seissol/tensorforge.git
            export PYTHONPATH=$(pwd)/tensorforge:$PYTHONPATH
            export CMAKE_PREFIX_PATH=$(python3 -c 'import tensorforge; tensorforge.print_cmake_path()'):$CMAKE_PREFIX_PATH
          else
            pip3 install --break-system-packages git+https://github.com/seissol/tensorforge.git
          fi

      - name: checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: build-variants
        id: build
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          python3 scripts/compile/compile_variants.py \
            --preset ci-gpu \
            --toolchain ${{ matrix.setup.name }} \
            --set device_backend=${{ matrix.setup.backend }} \
            --set device_arch=${{ matrix.setup.arch }} \
            --install-prefix /opt/seissol \
            --max-parallel 2 \
            --report build-report.json

      - name: upload-build-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          name: build-report-${{matrix.build_type}}-${{matrix.setup.arch}}-${{matrix.setup.backend}}-${{matrix.setup.name}}
          path: build-report.json
          if-no-files-found: ignore

      - name: upload-seissol
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: seissol-${{matrix.build_type}}-${{matrix.setup.arch}}-${{matrix.setup.backend}}-${{matrix.setup.name}}
          path: /opt/seissol

  seissol-run-test:
    name: seissol-run-test<${{matrix.setup.name}}, ${{matrix.setup.backend}}, ${{matrix.setup.arch}}, ${{matrix.build_type}}>
    runs-on: ${{matrix.setup.container-runner}}
    container:
      image: ${{ matrix.setup.container }}
      options: ${{ matrix.setup.container-options || ' ' }}
    needs: [seissol-build-test]
    if: ${{ github.repository == 'SeisSol/SeisSol' }}
    strategy:
      fail-fast: false
      matrix:
        precision:
          - single
        arch:
          - hsw
        build_type:
          - Release
        setup:
          - arch: sm_60
            backend: cuda
            name: gcc-13
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            pythonbreak: true
            mpi: openmpi
            container-options: --runtime=nvidia --gpus=all
            container-runner: gpu-nv
          - arch: sm_60
            backend: cuda
            name: clang-18
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            pythonbreak: true
            mpi: openmpi
            container-options: --runtime=nvidia --gpus=all
            container-runner: gpu-nv
        parallel:
          - ranks: 1
            threads: 4
            commthread: false
          #- ranks: 4
          #  threads: 1
          #  commthread: false
    steps:
      - name: install-packages
        run: |
          # circumvent problems with the Intel image still using Ubuntu 22.04
          if [ "${{ matrix.setup.pythonbreak }}" = true ]; then
            pip3 install --break-system-packages numpy>=1.12.0 lxml==5.0.0 setuptools seissolxdmf pandas jq
          else
            pip3 install numpy>=1.12.0 lxml==5.0.0 setuptools seissolxdmf pandas jq
          fi

      - name: get-precomputed-solutions
        uses: actions/checkout@v6
        with:
          repository: seissol/precomputed-seissol
          ref: ${{ env.precomputed-hash }}
          path: precomputed

      # The compare-*.py / verify.py scripts live in this very repo. The
      # workflow itself doesn't auto-checkout, so we do it explicitly here.
      - name: get-verification-scripts
        uses: actions/checkout@v6
        with:
          path: seissol-scripts
          sparse-checkout: scripts/validate
          sparse-checkout-cone-mode: false

      - name: get-seissol
        id: get-seissol
        uses: actions/download-artifact@v8
        with:
          name: seissol-${{matrix.build_type}}-${{matrix.setup.arch}}-${{matrix.setup.backend}}-${{matrix.setup.name}}
          path: install

      - name: verify
        id: verify
        run: |
          MPI_OPTIONS=""
          if [ "${{ matrix.setup.mpi }}" = openmpi ]; then
            MPI_OPTIONS="--oversubscribe --allow-run-as-root -bind-to none"
          fi

          export PATH=$(pwd)/install/bin:$PATH
          export LD_LIBRARY_PATH=$(pwd)/install/lib:$(pwd)/install/lib64:${LD_LIBRARY_PATH:-}
          chmod +x $(pwd)/install/bin/*

          export OMP_NUM_THREADS=${{ matrix.parallel.threads }}
          export SEISSOL_COMMTHREAD=${{ matrix.parallel.commthread }}
          export SEISSOL_MINI_NUM_ELEMENTS=100

          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          export OMPI_MCA_rmaps_base_oversubscribe=true

          python3 $GITHUB_WORKSPACE/seissol-scripts/scripts/validate/verify.py \
            --precomputed-dir precomputed \
            --binary-dir $GITHUB_WORKSPACE/install \
            --all \
            --mpi-cmd mpirun \
            --mpi-args "${MPI_OPTIONS}" \
            --ranks ${{ matrix.parallel.ranks }} \
            --threads ${{ matrix.parallel.threads }} \
            --color always \
            --report report.txt

      - name: upload-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.setup.name }}-r${{ matrix.parallel.ranks }}t${{ matrix.parallel.threads }}
          path: report.txt
          if-no-files-found: ignore
