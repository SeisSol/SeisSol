name: build-seissol-gpu
on:
  - push

env:
  precomputed-hash: 4cc0993d4ba3b8f0aabc84af78e405af9d98f902

jobs:
  seissol-build-test:
    name: seissol-build-test
    runs-on: ${{ matrix.setup.runner }}
    container: ${{ matrix.setup.container }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - snb # <-- needed for the self-hosted CI node for now :/
        build_type:
          - Release
          #- Debug
        # each setup builds the set ci-gpu of cmake/confignames.cmake (order 6, all materials, f32
        # and f64, elastic with 32 fused simulations in order 3) into one executable, whose kernels
        # TensorForge generates; and one configuration with the code generators the backend takes
        # by default (gemmforge, or tinytc on Intel GPUs), without TensorForge. A run chooses its
        # configuration with SEISSOL_CONFIGURATION.
        build:
          - configs: ci-gpu
            codegen: tensorforge
          - configs: elastic-linearck-o6-f32-stroud
            codegen: auto
        setup:
          - arch: sm_75
            backend: cuda
            cc: gcc-13
            cxx: g++-13
            fc: gfortran-13
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: sm_75
            backend: cuda
            cc: clang-18
            cxx: clang++-18
            fc: gfortran-13 # TODO?
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          # TODO: needs a working GPU runner
          #- arch: sm_75
          #  backend: cuda
          #  cc: nvc
          #  cxx: nvc++
          #  fc: nvfortran
          #  container: seissol/gha-gpu-nvhpc:davschneller-gpu-image
          #  runner: sccs-ci-nv-sm60
          #  pythonbreak: true
          - arch: gfx906
            backend: hip
            cc: gcc-13
            cxx: g++-13
            fc: gfortran-13
            container: seissol/gha-gpu-amd:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: gfx906
            backend: hip
            cc: clang-18
            cxx: clang++-18
            fc: gfortran-13 # TODO?
            container: seissol/gha-gpu-amd:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: skl
            backend: oneapi
            cc: icx
            cxx: icpx
            fc: ifx
            container: seissol/gha-gpu-intel:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: false
    steps:
      - name: checkout-seissol
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - id: build
        name: build-seissol
        run: |
          if [ "${{ matrix.build.codegen }}" = tensorforge ]; then
              if [ "${{ matrix.setup.pythonbreak }}" = false ]; then
                  # in the Intel image, pip ends without installing the tensorforge of the repository,
                  # and Python cannot import one there: install it regardless of what is installed,
                  # and its dependencies beforehand
                  pip3 install numpy pyyaml
                  pip3 install --ignore-installed --no-deps git+https://github.com/seissol/tensorforge.git
              else
                  pip3 install --break-system-packages git+https://github.com/seissol/tensorforge.git
              fi
          fi
          DEVICE_CODEGEN=${{ matrix.build.codegen }}

          mkdir build && cd build

          # TODO: change to `-Wall -Werror` at some point
          EXTRA_FLAGS="-Wall"

          export CFLAGS="${EXTRA_FLAGS} ${CFLAGS}"
          export CXXFLAGS="${EXTRA_FLAGS} ${CXXFLAGS}"
          export FFLAGS="${EXTRA_FLAGS} ${FFLAGS}"

          export CC=${{matrix.setup.cc}}
          export CXX=${{matrix.setup.cxx}}
          export FC=${{matrix.setup.fc}}

          mkdir -p /opt/seissol

          if [ ${{matrix.setup.cc}} = nvc ]; then
            TESTING_COMMAND="mpirun -np 1 --oversubscribe --allow-run-as-root";
          else
            TESTING_COMMAND="";
          fi;

          # HIP may consume too much memory; hence disable the codegen tests for now
          if [ ${{matrix.setup.backend}} = hip ]; then
            TESTING_GENERATED=OFF;
          else
            TESTING_GENERATED=ON;
          fi;

          cmake .. \
            -GNinja \
            -DTESTING_COMMAND="${TESTING_COMMAND}" \
            -DCMAKE_INSTALL_PREFIX=/opt/seissol \
            -DTESTING=ON \
            -DTESTING_GENERATED=$TESTING_GENERATED \
            -DTESTING_BUILD_ONLY=ON \
            -DASAGI=ON \
            -DHOST_ARCH=${{matrix.arch}} \
            -DDEVICE_CODEGEN=${DEVICE_CODEGEN} \
            -DDEVICE_BACKEND=${{matrix.setup.backend}} \
            -DDEVICE_ARCH=${{matrix.setup.arch}} \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
            -DCONFIGS=${{matrix.build.configs}}

          ninja install

      - name: upload-seissol
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: seissol-${{matrix.build_type}}-${{matrix.setup.arch}}-${{matrix.setup.backend}}-${{matrix.build.configs}}-${{matrix.setup.cc}}
          path: /opt/seissol

  seissol-run-test:
    name: seissol-run-test
    runs-on: sccs-ci-nv-sm60
    container: ${{ matrix.setup.container }}
    needs: [seissol-build-test]
    if: ${{ github.repository == 'SeisSol/SeisSol' && false }}
    env:
      CONFIGNAME: |
        ${{
          format('{0}-o{1}-{2}-stroud{3}',
            matrix.case.config,
            matrix.case.order,
            matrix.precision == 'single' && 'f32' || 'f64',
            matrix.case.multisim != 1 && format('-s{0}', matrix.case.multisim) || ''
          )
        }}
    strategy:
      fail-fast: false
      matrix:
        case:
          # NOTE: the commented tests do not yet work on the GPU on this branch
          - name: tpv5
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv5-nuc
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv5-visco
            config: viscoelastic-linearckanelastic-m3
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv5-poro
            config: poroelastic-stp
            multisim: 1
            energies: false # incomplete, hence disabled
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv6
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv13
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv16
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv101
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv101-slip
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv104
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpv105
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: ahsp
            config: anisotropic-linearck
            multisim: 1
            energies: false
            receivers: true
            fault: false
            volume: true
            surface: false
            order: 6
          - name: tpvgaussian
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: tpvyoffe
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: false
            order: 6
          - name: ttpv1
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: true
            volume: true
            surface: true
            order: 6
          - name: loh1-fused
            config: elastic-linearck
            multisim: 32
            energies: true
            receivers: true
            fault: false # NYI
            volume: false
            surface: false
            order: 3
          - name: loh1-ic
            config: elastic-linearck
            multisim: 1
            energies: true
            receivers: true
            fault: false
            volume: true
            surface: false
            order: 6
        precision:
          - single
        arch:
          - hsw
        build_type:
          - Release
        setup:
          - arch: sm_75
            backend: cuda
            cc: gcc-13
            cxx: g++-13
            fc: gfortran-13
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            pythonbreak: true
            mpi: openmpi
          - arch: sm_75
            backend: cuda
            cc: clang-18
            cxx: clang++-18
            fc: gfortran-13 # TODO?
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            pythonbreak: true
            mpi: openmpi
          # TODO: needs a working GPU runner
          #- arch: sm_75
          #  backend: cuda
          #  cc: nvc
          #  cxx: nvc++
          #  fc: nvfortran
          #  container: seissol/gha-gpu-nvhpc:davschneller-gpu-image
          #  pythonbreak: true
          #  mpi: openmpi
        parallel:
          - ranks: 1
            threads: 4
            commthread: false
          - ranks: 4
            threads: 1
            commthread: false
    steps:
      - name: install-packages # TODO: move to containers
        run: |
          # circumvent problems with the Intel image still using Ubuntu 22.04

          if [ "${{ matrix.setup.pythonbreak }}" = true ]; then
            pip3 install --break-system-packages numpy>=1.12.0 lxml==5.0.0 setuptools seissolxdmf pandas
          else
            pip3 install numpy>=1.12.0 lxml==5.0.0 setuptools seissolxdmf pandas
          fi

      - id: load-precomputed-solutions
        name: load-precomputed-solutions
        uses: corca-ai/local-cache@v3
        with:
          key: ${{env.precomputed-hash}}
          path: precomputed
          base: /home/runner/_cache
      - name: get-seissol
        uses: actions/download-artifact@v5
        with:
          name: seissol-${{matrix.build_type}}-${{matrix.setup.arch}}-${{matrix.setup.backend}}-ci-gpu-${{matrix.setup.cc}}
          path: install
      - name: run-seissol
        id: run
        run: |
          if [ ${{matrix.setup.mpi}} = openmpi ]; then
            MPI_OPTIONS="--oversubscribe --allow-run-as-root";
          elif [ ${{matrix.setup.mpi}} = intel ]; then
            MPI_OPTIONS="";
          else
            MPI_OPTIONS="";
          fi;

          export PATH=$(pwd)/install/bin:$PATH
          export LD_LIBRARY_PATH=$(pwd)/install/lib:$(pwd)/install/lib64:$LD_LIBRARY_PATH

          chmod +x $(pwd)/install/bin/*

          export OMP_NUM_THREADS=${{matrix.parallel.threads}}
          export SEISSOL_COMMTHREAD=${{matrix.parallel.commthread}}
          export SEISSOL_MINI_NUM_ELEMENTS=100

          # FIXME: compile the container with GPU-aware MPI
          export SEISSOL_USM_MPI=1

          cd precomputed/${{matrix.case.name}}

          export SEISSOL_CONFIGURATION=$(echo ${CONFIGNAME})

          mpirun ${MPI_OPTIONS} -np ${{matrix.parallel.ranks}} seissol

      # TODO: make this checkout obsolete
      - name: get-verification-scripts
        uses: actions/checkout@v6
        with:
          path: scripts

      # for now, compare faults only on single-rank setups
      - name: check-fault
        if: ${{ !cancelled() && steps.run.outcome == 'success' && matrix.case.fault }}
        run: |
          FAULT_FILE=tpv-fault.xdmf
          EPSILON=0.05

          cd precomputed/${{matrix.case.name}}
          python3 $GITHUB_WORKSPACE/scripts/postprocessing/validation/compare-mesh.py ./output/${FAULT_FILE} ./precomputed/${{matrix.precision}}/${FAULT_FILE} --epsilon ${EPSILON}
      - name: check-volume
        if: ${{ !cancelled() && steps.run.outcome == 'success' && matrix.case.volume }}
        run: |
          # the wavefield output is named after what it holds; the references predate that
          VOLUME_FILE=tpv-wavefield.xdmf
          VOLUME_FILE_REF=tpv.xdmf
          EPSILON=0.05

          cd precomputed/${{matrix.case.name}}
          python3 $GITHUB_WORKSPACE/scripts/postprocessing/validation/compare-mesh.py ./output/${VOLUME_FILE} ./precomputed/${{matrix.precision}}/${VOLUME_FILE_REF} --epsilon ${EPSILON}
      - name: check-surface
        if: ${{ !cancelled() && steps.run.outcome == 'success' && matrix.case.surface }}
        run: |
          SURFACE_FILE=tpv-surface.xdmf
          EPSILON=0.05

          cd precomputed/${{matrix.case.name}}
          python3 $GITHUB_WORKSPACE/scripts/postprocessing/validation/compare-mesh.py ./output/${SURFACE_FILE} ./precomputed/${{matrix.precision}}/${SURFACE_FILE} --epsilon ${EPSILON}
      - name: check-receivers
        if: ${{ !cancelled() && steps.run.outcome == 'success' && matrix.case.receivers }}
        run: |
          EPSILON=0.05

          cd precomputed/${{matrix.case.name}}
          python3 $GITHUB_WORKSPACE/scripts/postprocessing/validation/compare-receivers.py ./output ./precomputed/${{matrix.precision}} --epsilon ${EPSILON}
      - name: check-energy
        if: ${{ !cancelled() && steps.run.outcome == 'success' && matrix.case.energies }}
        run: |
          ENERGY_FILE=tpv-energy.csv
          EPSILON=0.05

          cd precomputed/${{matrix.case.name}}
          python3 $GITHUB_WORKSPACE/scripts/postprocessing/validation/compare-energies.py ./output/${ENERGY_FILE} ./precomputed/${{matrix.precision}}/${ENERGY_FILE} --epsilon ${EPSILON}
