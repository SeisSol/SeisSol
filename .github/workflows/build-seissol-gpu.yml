name: build-seissol-gpu
on:
  - push
  # a run started by hand verifies its branch as well, not only master
  - workflow_dispatch

env:
  precomputed-hash: bed56573928e224984f5e75a17feb8b0b2f5ea27

jobs:
  # ---------------------------------------------------------------------------
  # Build SeisSol per backend and compiler, as master does: one executable of
  # all configurations of the set ci-gpu, whose kernels TensorForge generates,
  # and one of a single configuration with the code generators the backend
  # takes without TensorForge (the preset ci-gpu of
  # scripts/compile/compile-variants.yaml).
  # ---------------------------------------------------------------------------
  seissol-build-test:
    name: seissol-build-test<${{matrix.setup.name}}, ${{matrix.setup.backend}}, ${{matrix.setup.arch}}, ${{matrix.build_type}}>
    runs-on: ubuntu-26.04
    container: ${{ matrix.setup.container }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        arch:
          - hsw
        build_type:
          - Release
          #- Debug
        # `name` selects the entry from the `toolchains:` block in
        # scripts/compile/compile-variants.yaml.
        setup:
          - arch: sm_86
            backend: cuda
            name: gcc-13
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: sm_86
            backend: cuda
            name: clang-18
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: gfx906
            backend: hip
            name: gcc-13
            container: seissol/gha-gpu-amd:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: gfx906
            backend: hip
            name: clang-18
            container: seissol/gha-gpu-amd:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: true
          - arch: skl
            backend: oneapi
            name: icx-2024
            container: seissol/gha-gpu-intel:davschneller-gpu-image
            runner: ubuntu-26.04
            pythonbreak: false
    steps:
      - name: setup
        run: |
          # h5py for the verification tests, which write their meshes with it (and with numpy, which
          # TensorForge brings along)
          if [ "${{ matrix.setup.pythonbreak }}" = false ]; then
            # in the Intel image, pip ends without installing the TensorForge of the repository, and
            # Python cannot import one there: take it from a clone instead, for the steps below as
            # well, and its dependencies from pip
            pip3 install numpy pyyaml h5py
            git clone https://github.com/seissol/tensorforge.git ${RUNNER_TEMP}/tensorforge
            echo "PYTHONPATH=${RUNNER_TEMP}/tensorforge/src${PYTHONPATH:+:${PYTHONPATH}}" >> ${GITHUB_ENV}
            echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/tensorforge/src/tensorforge/share/cmake${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}" >> ${GITHUB_ENV}
            echo "TensorForge: $(git -C ${RUNNER_TEMP}/tensorforge log -1 --format='%H %cd %s')"
          else
            pip3 install --break-system-packages git+https://github.com/seissol/tensorforge.git h5py
            # the commit the install took, which the default branch had when the job ran
            python3 -c "import importlib.metadata as m; print('TensorForge:', m.distribution('tensorforge').read_text('direct_url.json'))"
          fi

      - name: checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: build-variants
        id: build
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          # the generated kernel tests do not configure with HIP: their host library links
          # hip::host, which cmake/hip.cmake does not find; master's CI leaves them out there as well
          if [ "${{ matrix.setup.backend }}" = hip ]; then
            TESTING_GENERATED=OFF
          else
            TESTING_GENERATED=ON
          fi

          python3 scripts/compile/compile_variants.py \
            --preset ci-gpu \
            --toolchain ${{ matrix.setup.name }} \
            --set device_backend=${{ matrix.setup.backend }} \
            --set device_arch=${{ matrix.setup.arch }} \
            --set defines.TESTING_GENERATED=${TESTING_GENERATED} \
            --install-prefix /opt/seissol \
            --max-parallel 1 \
            --report build-report.json

      - name: upload-build-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          name: build-report-${{matrix.build_type}}-${{matrix.setup.arch}}-${{matrix.setup.backend}}-${{matrix.setup.name}}
          path: build-report.json
          if-no-files-found: ignore

      - name: upload-seissol
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: seissol-${{matrix.build_type}}-${{matrix.setup.arch}}-${{matrix.setup.backend}}-${{matrix.setup.name}}
          path: /opt/seissol

  seissol-run-test:
    name: seissol-run-test<${{matrix.setup.name}}, ${{matrix.setup.backend}}, ${{matrix.setup.arch}}, ${{matrix.build_type}}>
    runs-on: ${{matrix.setup.container-runner}}
    container:
      image: ${{ matrix.setup.container }}
      options: ${{ matrix.setup.container-options || ' ' }}
    needs: [seissol-build-test]
    # Only on master for now, and in runs started by hand: the runner takes one job at a time, so
    # the verification of every push queued up behind that of the pushes before it. It runs
    # whatever the builds end in: a failed build of another leg (as of a backend that is not
    # verified) holds back none of the others, and a leg whose own build failed finds no
    # executable to download.
    if: ${{ !cancelled() && github.repository == 'SeisSol/SeisSol' && (github.ref_name == 'master' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        precision:
          - single
        arch:
          - hsw
        build_type:
          - Release
        setup:
          - arch: sm_86
            backend: cuda
            name: gcc-13
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            pythonbreak: true
            mpi: openmpi
            container-options: --runtime=nvidia --gpus=all
            container-runner: gpu-nv
          - arch: sm_86
            backend: cuda
            name: clang-18
            container: seissol/gha-gpu-nv:davschneller-gpu-image
            pythonbreak: true
            mpi: openmpi
            container-options: --runtime=nvidia --gpus=all
            container-runner: gpu-nv
        parallel:
          - ranks: 1
            threads: 4
            commthread: false
          #- ranks: 4
          #  threads: 1
          #  commthread: false
    steps:
      - name: clean-workspace
        run: |
          # A self-hosted runner keeps the workspace of the repository from one job to the next, of
          # every workflow and branch: what an earlier job downloaded to install/ would stay next to
          # the executables of this build, and verify.py takes an executable
          # seissol-<configuration> before the shared seissol. Nor may the report of an earlier job
          # pass for this one's, should verify.py stop before writing its own.
          rm -rf install report.txt

      - name: install-packages
        run: |
          # circumvent problems with the Intel image still using Ubuntu 22.04
          if [ "${{ matrix.setup.pythonbreak }}" = true ]; then
            pip3 install --break-system-packages "numpy>=1.12.0" lxml==5.0.0 setuptools seissolxdmf h5py pandas jq
          else
            pip3 install "numpy>=1.12.0" lxml==5.0.0 setuptools seissolxdmf h5py pandas jq
          fi

      - name: get-precomputed-solutions
        uses: actions/checkout@v6
        with:
          repository: seissol/precomputed-seissol
          ref: ${{ env.precomputed-hash }}
          path: precomputed

      # The compare-*.py / verify.py scripts live in this very repo. The
      # workflow itself doesn't auto-checkout, so we do it explicitly here.
      - name: get-verification-scripts
        uses: actions/checkout@v6
        with:
          path: seissol-scripts
          sparse-checkout: scripts/validate
          sparse-checkout-cone-mode: false

      - name: get-seissol
        id: get-seissol
        uses: actions/download-artifact@v8
        with:
          name: seissol-${{matrix.build_type}}-${{matrix.setup.arch}}-${{matrix.setup.backend}}-${{matrix.setup.name}}
          path: install

      - name: verify
        id: verify
        run: |
          MPI_OPTIONS=""
          if [ "${{ matrix.setup.mpi }}" = openmpi ]; then
            MPI_OPTIONS="--oversubscribe --allow-run-as-root -bind-to none"
          fi

          export PATH=$(pwd)/install/bin:$PATH
          export LD_LIBRARY_PATH=$(pwd)/install/lib:$(pwd)/install/lib64:${LD_LIBRARY_PATH:-}
          chmod +x $(pwd)/install/bin/*
          # the executables verify.py chooses from
          ls -l $(pwd)/install/bin

          export OMP_NUM_THREADS=${{ matrix.parallel.threads }}
          export SEISSOL_COMMTHREAD=${{ matrix.parallel.commthread }}
          export SEISSOL_MINI_NUM_ELEMENTS=100

          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          export OMPI_MCA_rmaps_base_oversubscribe=true

          python3 $GITHUB_WORKSPACE/seissol-scripts/scripts/validate/verify.py \
            --precomputed-dir precomputed \
            --binary-dir $GITHUB_WORKSPACE/install \
            --all \
            --mpi-cmd mpirun \
            --mpi-args "${MPI_OPTIONS}" \
            --ranks ${{ matrix.parallel.ranks }} \
            --threads ${{ matrix.parallel.threads }} \
            --color always \
            --report report.txt

      - name: upload-report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.setup.name }}-r${{ matrix.parallel.ranks }}t${{ matrix.parallel.threads }}
          path: report.txt
          if-no-files-found: ignore
